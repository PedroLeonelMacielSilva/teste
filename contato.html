<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contato | Leonel</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #ffffff;
}

header {
    width: 100%;
    height: 190px;
    position: relative;
    overflow: hidden;
    background-image:
        linear-gradient(
            90deg,
            rgba(4, 39, 88, 0.486) 0%,
            rgba(5, 48, 103, 0.363) 35%,
            rgba(5, 48, 103, 0.25) 75%,
            rgba(5, 48, 103, 0.05) 100%
        ),
        url("img/vitoria-aerea.jpg");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}
/* CONTEÚDO DO HEADER */

.header-conteudo {
    width: 100%;
    max-width: 1083px;
    height: 100%;
    margin: 0 auto;
    padding: 0 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
}


/* =========================
   MAIN
========================= */

main {
    flex: 1;
    display: flex;
    align-items: center;

    background: linear-gradient(
        110deg,
        #082d68 0%,
        #0c3d82 50%,
        #0b356f 100%
    );
}
/* CONTEÚDO DO MAIN */
.contato-container {
    width: 100%;
    max-width: 1083px;
    margin: 0 auto;
    padding: 60px 40px;
    display: grid;
    grid-template-columns:
        210px
        1fr
        auto;
    align-items: center;
    gap: 40px;
}
/* =========================
   FOTO
========================= */

.foto-container {
    width: 210px;
    height: 310px;
    background-color: rgba(245, 222, 179, 0.514);
    overflow: hidden;
    border-radius: 15px;
}

.foto-container img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}


/* =========================
   TEXTO
========================= */
.contato-texto {
    margin: 0;
}

.subtitulo {
    display: block;
    margin-bottom: 10px;
    color: #20b9ee;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 3px;
}

.contato-texto h2 {
    margin: 0 0 14px;
    color: #ffffff;
    font-size: 45px;
    font-weight: bolder;
    line-height: 1.1;
}

.contato-texto p {
    color: rgba(255, 255, 255, 0.822);

    font-size: 17px;
    font-weight: 700;
    line-height: 1.5;
}


/* =========================
   AÇÕES
========================= */

.contato-acoes {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}


/* WHATSAPP */

/* =========================
   WHATSAPP
========================= */

.whatsapp {
    width: 290px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    background: #f8785f;
    color: #092f69;
    text-decoration: none;
    border-radius: 40px;
    font-size: 21px;
    font-weight: 800;
    box-shadow: 5px 5px 10px 0px rgba(248, 120, 95, 0.35);
    transition: all 0.3s ease;
}

.whatsapp i {
    font-size: 25px;
}
.whatsapp:hover {
    transform: translateY(-3px);
    background: #ff8b74;
    box-shadow: 0 8px 22px rgba(248, 120, 95, 0.45);
}
/* =========================
   REDES
========================= */
.redes {
    display: flex;
    gap: 10px;
}
.redes a {
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #f8785f;
    border-radius: 50%;
    color: #f8785f;
    text-decoration: none;
    font-size: 20px;
    transition: 0.3s;
}
.redes a:hover {
    background: #f8785f;
    color: #092f69;
    transform: translateY(-3px);
}

footer {
    width: 100%;
    height: 9px;
    display: flex;
    flex-shrink: 0;
    background: #082d68;
}

footer span {
    height: 100%;

    background: #1db8ed;
}

footer span:nth-child(1) {
    width: 8%;
}

footer span:nth-child(2) {
    width: 5%;
    background: #082d68;
}

footer span:nth-child(3) {
    width: 11%;
}

footer span:nth-child(4) {
    width: 3%;
    background: #082d68;
}

footer span:nth-child(5) {
    width: 7%;
}

footer span:nth-child(6) {
    width: 13%;
    background: #082d68;
}

footer span:nth-child(7) {
    width: 21%;
}

footer span:nth-child(8) {
    flex: 1;
    background: #082d68;
}


/* =========================
   TABLET
========================= */

@media (max-width: 850px) {

    header {
        height: 280px;
    }

    .header-conteudo {
        padding: 0 6%;
    }

    .contato-container {
        grid-template-columns: 180px 1fr;

        padding: 50px 6%;

        gap: 30px;
    }

    .foto-container {
        width: 180px;
        height: 220px;
    }

    .contato-acoes {
        grid-column: 1 / -1;

        flex-direction: row;

        justify-content: center;
    }
}


/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    header {
        height: 250px;
    }

    .header-conteudo {
        padding: 0 25px;
    }

    .header-conteudo h1 {
        font-size: 31px;
    }

    .header-linha {
        margin-top: 16px;
    }

    main {
        align-items: flex-start;
    }

    .contato-container {
        display: flex;

        flex-direction: column;

        text-align: center;

        padding: 45px 25px 50px;

        gap: 25px;
    }

    .foto-container {
        width: 180px;
        height: 210px;
    }

    .contato-texto {
        width: 100%;
    }

    .contato-texto h2 {
        font-size: 30px;
    }

    .contato-texto p {
        font-size: 13px;
    }

    .contato-acoes {
        width: 100%;

        flex-direction: column;
    }

    .redes {
        gap: 8px;
    }

    footer {
        height: 7px;
    }
}

</style>
</head>
<body>
<!-- =========================
     HEADER
========================= -->

<header>

</header>


<!-- =========================
     MAIN
========================= -->

<main>

    <div class="contato-container">
        <!-- FOTO -->
        <div class="foto-container">
            <img
                src="img/leonel-retrato.png"
                alt="Leonel"
            >
        </div>
        <!-- TEXTO -->
        <div class="contato-texto">
            <span class="subtitulo">
                CONTATO
            </span>
            <h2>
                Vamos conversar
            </h2>
            <p>
                Chame no Whatsapp ou acompanhe o dia a dia nas redes.
            </p>
        </div>
        <!-- BOTÕES -->
        <div class="contato-acoes">
            <a href="#" class="whatsapp">
                <i class="fa-brands fa-whatsapp"></i>
                <span>
                    Falar no Whatsapp
                </span>
            </a>
            <div class="redes">
                <a href="#" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="#" aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
                <a href="#" aria-label="X">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
                <a href="#" aria-label="YouTube">
                    <i class="fa-brands fa-youtube"></i>
                </a>
                <a href="#" aria-label="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
            </div>
        </div>
    </div>
</main>
<!-- =========================
     FOOTER
========================= -->
<footer>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</footer>
</body>
</html>
