
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Contato | Leonel</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    width:100%;
    min-height:100%;
}

body{
    width:100%;
    min-height:100vh;

    display:flex;
    flex-direction:column;

    font-family:'Inter', sans-serif;

    background:#ffffff;

    overflow-x:hidden;
}


/* =====================================================
   HEADER
===================================================== */

header{

    width:100%;

    /*
       A altura se adapta ao tamanho da tela.
    */
    height:clamp(170px, 22vw, 280px);

    position:relative;

    overflow:hidden;

    background-image:

        linear-gradient(
            90deg,
            rgba(4,39,88,.65) 0%,
            rgba(5,48,103,.43) 40%,
            rgba(5,48,103,.18) 75%,
            rgba(5,48,103,.05) 100%
        ),

        url("img/vitoria-aerea.jpg");

    background-position:center;

    background-size:cover;

    background-repeat:no-repeat;
}


/* Linha superior colorida */

header::before{

    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:4px;

    background:
        linear-gradient(
            to right,
            rgb(242,122,115),
            rgb(149,191,220),
            rgb(54,65,120)
        );

    z-index:2;
}


/* =====================================================
   MAIN
===================================================== */

main{

    flex:1;

    width:100%;

    display:flex;

    align-items:center;

    background:
        linear-gradient(
            110deg,
            #082d68 0%,
            #0c3d82 50%,
            #0b356f 100%
        );
}


/* =====================================================
   CONTAINER
===================================================== */

.contato-container{

    width:100%;

    max-width:1180px;

    margin:0 auto;

    padding:
        clamp(40px, 6vw, 75px)
        clamp(20px, 5vw, 60px);

    display:grid;

    /*
       Foto | Texto | Ações
    */

    grid-template-columns:
        minmax(160px,210px)
        minmax(250px,1fr)
        minmax(230px,290px);

    align-items:center;

    gap:clamp(25px,4vw,55px);
}


/* =====================================================
   FOTO
===================================================== */

.foto-container{

    width:100%;

    /*
       Mantém proporção da foto.
    */

    aspect-ratio:2 / 3;

    max-height:330px;

    background:#e8e8e8;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
        0 12px 30px rgba(0,0,0,.14);
}

.foto-container img{

    width:100%;

    height:100%;

    display:block;

    object-fit:cover;

    object-position:center;
}


/* =====================================================
   TEXTO
===================================================== */

.contato-texto{

    width:100%;

    margin:0;
}

.subtitulo{

    display:block;

    margin-bottom:10px;

    color:#20b9ee;

    font-size:
        clamp(13px,1.5vw,19px);

    font-weight:700;

    letter-spacing:
        clamp(1.5px, .3vw, 3px);
}

.contato-texto h2{

    margin:0 0 15px;

    color:#ffffff;

    font-size:
        clamp(30px,4vw,50px);

    font-weight:800;

    line-height:1.1;
}

.contato-texto p{

    max-width:520px;

    color:
        rgba(255,255,255,.84);

    font-size:
        clamp(13px,1.4vw,17px);

    font-weight:500;

    line-height:1.6;
}


/* =====================================================
   AÇÕES
===================================================== */

.contato-acoes{

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:20px;
}


/* =====================================================
   WHATSAPP
===================================================== */

.whatsapp{

    width:100%;

    max-width:290px;

    min-height:68px;

    padding:
        12px 22px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:14px;

    background:#f8785f;

    color:#092f69;

    text-decoration:none;

    border-radius:50px;

    font-size:
        clamp(16px,1.6vw,21px);

    font-weight:800;

    box-shadow:
        5px 5px 12px
        rgba(248,120,95,.30);

    transition:
        .3s ease;
}

.whatsapp i{

    font-size:
        clamp(21px,2vw,26px);

    flex-shrink:0;
}

.whatsapp:hover{

    transform:
        translateY(-3px);

    background:#ff8b74;

    box-shadow:
        0 10px 25px
        rgba(248,120,95,.45);
}


/* =====================================================
   REDES SOCIAIS
===================================================== */

.redes{

    display:flex;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;

    gap:9px;
}

.redes a{

    width:45px;

    height:45px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:
        1px solid #f8785f;

    border-radius:50%;

    color:#f8785f;

    text-decoration:none;

    font-size:20px;

    transition:.3s ease;
}

.redes a:hover{

    background:#f8785f;

    color:#092f69;

    transform:
        translateY(-3px);
}


/* =====================================================
   FOOTER
===================================================== */

footer{

    width:100%;

    height:9px;

    display:flex;

    flex-shrink:0;

    background:#082d68;
}

footer span{

    height:100%;

    background:#1db8ed;
}

footer span:nth-child(1){
    width:8%;
}

footer span:nth-child(2){

    width:5%;

    background:#082d68;
}

footer span:nth-child(3){
    width:11%;
}

footer span:nth-child(4){

    width:3%;

    background:#082d68;
}

footer span:nth-child(5){
    width:7%;
}

footer span:nth-child(6){

    width:13%;

    background:#082d68;
}

footer span:nth-child(7){
    width:21%;
}

footer span:nth-child(8){

    flex:1;

    background:#082d68;
}


/* =====================================================
   NOTEBOOK / TABLET GRANDE
===================================================== */

@media(max-width:1050px){

    .contato-container{

        grid-template-columns:
            180px
            minmax(250px,1fr)
            250px;

        gap:28px;

        padding-left:5%;
        padding-right:5%;
    }

    .foto-container{

        max-height:290px;
    }

    .contato-texto h2{

        font-size:36px;
    }

    .whatsapp{

        max-width:250px;
    }
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:850px){

    header{

        height:220px;
    }

    .contato-container{

        grid-template-columns:
            180px
            1fr;

        gap:30px;

        padding:
            50px 6%;
    }

    .foto-container{

        width:180px;

        height:270px;

        aspect-ratio:auto;

        max-height:none;
    }

    .contato-texto h2{

        font-size:38px;
    }

    .contato-acoes{

        grid-column:
            1 / -1;

        flex-direction:row;

        justify-content:center;

        flex-wrap:wrap;

        gap:20px;
    }

    .whatsapp{

        width:280px;
    }
}


/* =====================================================
   TABLET PEQUENO
===================================================== */

@media(max-width:700px){

    header{

        height:190px;
    }

    .contato-container{

        grid-template-columns:
            150px
            1fr;

        gap:22px;

        padding:
            40px 5%;
    }

    .foto-container{

        width:150px;

        height:230px;
    }

    .contato-texto h2{

        font-size:32px;
    }

    .contato-texto p{

        font-size:14px;
    }

    .whatsapp{

        width:250px;

        min-height:62px;

        font-size:17px;
    }
}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:600px){

    header{

        height:180px;

        background-position:center center;
    }

    main{

        align-items:flex-start;
    }

    .contato-container{

        width:100%;

        display:flex;

        flex-direction:column;

        align-items:center;

        text-align:center;

        padding:
            40px 22px 45px;

        gap:25px;
    }

    /* FOTO */

    .foto-container{

        width:175px;

        height:230px;

        flex-shrink:0;

        border-radius:16px;

        margin:auto;
    }

    /* TEXTO */

    .contato-texto{

        width:100%;

        display:flex;

        flex-direction:column;

        align-items:center;
    }

    .subtitulo{

        font-size:13px;

        letter-spacing:2px;

        margin-bottom:9px;
    }

    .contato-texto h2{

        font-size:
            clamp(28px,8vw,34px);

        margin-bottom:12px;
    }

    .contato-texto p{

        max-width:330px;

        font-size:13px;

        line-height:1.65;
    }

    /* AÇÕES */

    .contato-acoes{

        width:100%;

        display:flex;

        flex-direction:column;

        align-items:center;

        gap:18px;
    }

    .whatsapp{

        width:100%;

        max-width:330px;

        min-height:62px;

        font-size:17px;
    }

    .redes{

        width:100%;

        max-width:330px;

        gap:8px;
    }

    .redes a{

        width:43px;

        height:43px;

        font-size:18px;
    }

    footer{

        height:7px;
    }
}


/* =====================================================
   CELULAR PEQUENO
===================================================== */

@media(max-width:380px){

    header{

        height:160px;
    }

    .contato-container{

        padding:
            32px 18px 40px;

        gap:22px;
    }

    .foto-container{

        width:155px;

        height:205px;
    }

    .contato-texto h2{

        font-size:27px;
    }

    .contato-texto p{

        font-size:12px;
    }

    .whatsapp{

        max-width:300px;

        min-height:58px;

        font-size:15px;

        gap:10px;
    }

    .whatsapp i{

        font-size:21px;
    }

    .redes a{

        width:40px;

        height:40px;

        font-size:17px;
    }
}


/* =====================================================
   CELULAR MUITO ESTREITO
===================================================== */

@media(max-width:330px){

    .contato-container{

        padding-left:15px;
        padding-right:15px;
    }

    .foto-container{

        width:145px;

        height:195px;
    }

    .redes{

        gap:5px;
    }

    .redes a{

        width:38px;

        height:38px;
    }
}

</style>
</head>
<body>
<header>
</header>
<main>
    <div class="contato-container">
        <!-- FOTO -->
        <div class="foto-container">
            <img
                src="img/leonel-retrato.png"
                alt="Leonel"
            >
        </div>
        <!-- TEXTO -->
        <div class="contato-texto">
            <span class="subtitulo">
                CONTATO
            </span>
            <h2>
                Vamos conversar
            </h2>
            <p>
                Chame no Whatsapp ou acompanhe o dia a dia nas redes.
            </p>
        </div>
        <!-- AÇÕES -->
        <div class="contato-acoes">
            <a
                href="#"
                class="whatsapp"
            >
                <i class="fa-brands fa-whatsapp"></i>
                <span>
                    Falar no Whatsapp
                </span>
            </a>
            <div class="redes">
                <a
                    href="#"
                    aria-label="Instagram"
                >
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a
                    href="#"
                    aria-label="Facebook"
                >
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
                <a
                    href="#"
                    aria-label="X"
                >
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
                <a
                    href="#"
                    aria-label="YouTube"
                >
                    <i class="fa-brands fa-youtube"></i>
                </a>
                <a
                    href="#"
                    aria-label="TikTok"
                >
                    <i class="fa-brands fa-tiktok"></i>
                </a>
            </div>
        </div>
    </div>
</main>
<!-- =====================================================
     FOOTER
===================================================== -->
<footer>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</footer>
</body>
</html>
